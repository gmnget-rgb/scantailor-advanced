name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake autopoint bash bison bzip2 flex gettext \
            git g++ gperf intltool libc6-dev-i386 libgdk-pixbuf-2.0-dev \
            libltdl-dev libssl-dev libtool-bin libxml-parser-perl \
            make openssl patch perl pkg-config python3 python3-mako ruby sed \
            unzip wget xz-utils cmake ninja-build zip lzip

      - name: Clone MXE
        run: |
          git clone https://github.com/mxe/mxe.git $HOME/mxe

      - name: Build Windows dependencies with MXE
        run: |
          cd $HOME/mxe
          make MXE_TARGETS=x86_64-w64-mingw32.static qtbase jpeg libpng tiff zlib boost

      - name: Build ScanTailor Advanced for Windows
        run: |
          chmod +x ./build-windows.sh
          MXE_DIR=$HOME/mxe ./build-windows.sh static

      - name: Package EXE
        run: |
          mkdir -p package
          find build-win-static -name "*.exe" -print
          cp $(find build-win-static -name "scantailor-advanced.exe" -o -name "scantailor.exe" | head -1) package/
          cd package
          zip -r ../scantailor-advanced-windows-x64.zip .

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: scantailor-advanced-windows-x64
          path: scantailor-advanced-windows-x64.zip
