name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake autopoint bash bison bzip2 flex gettext \
            git g++ gperf intltool libc6-dev-i386 libgdk-pixbuf-2.0-dev \
            libltdl-dev libssl-dev libtool-bin libxml-parser-perl \
            make openssl patch perl pkg-config python3 python3-mako ruby sed \
            unzip wget xz-utils cmake ninja-build zip lzip \
            libgl1-mesa-dev libglu1-mesa-dev libegl1-mesa-dev mesa-common-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb1-dev libxcb-cursor-dev libxcb-glx0-dev libxcb-icccm4-dev \
            libxcb-image0-dev libxcb-keysyms1-dev libxcb-randr0-dev \
            libxcb-render-util0-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-shm0-dev libxcb-sync-dev libxcb-xfixes0-dev \
            libxcb-xinerama0-dev libxcb-xinput-dev libxcb-xkb-dev

      - name: Cache MXE
        id: cache-mxe
        uses: actions/cache@v4
        with:
          path: ~/mxe
          key: mxe-${{ runner.os }}-x86_64-static-qt6-v4
          restore-keys: |
            mxe-${{ runner.os }}-x86_64-static-qt6-

      - name: Clone MXE
        if: steps.cache-mxe.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/mxe/mxe.git "$HOME/mxe"

      - name: Build Windows dependencies with MXE
        if: steps.cache-mxe.outputs.cache-hit != 'true'
        run: |
          cd "$HOME/mxe"

          make MXE_TARGETS=x86_64-w64-mingw32.static \
            qt6-qtbase qt6-qttools jpeg libpng tiff zlib boost || {
              echo "MXE build failed. Showing Qt6 logs:"
              echo "----------------------------------------"
              find "$HOME/mxe/log" -name "qt6-qtbase*" -print -exec tail -n 120 {} \;
              echo "----------------------------------------"
              exit 1
            }

      - name: Verify MXE and Qt6
        run: |
          export PATH="$HOME/mxe/usr/bin:$PATH"

          echo "Checking MXE tools..."
          which x86_64-w64-mingw32.static-cmake
          which x86_64-w64-mingw32.static-gcc
          which x86_64-w64-mingw32.static-g++
          which x86_64-w64-mingw32.static-windres

          echo "Checking Qt6Config.cmake..."
          find "$HOME/mxe/usr/x86_64-w64-mingw32.static" -name "Qt6Config.cmake" -print

          QT6_CONFIG="$(find "$HOME/mxe/usr/x86_64-w64-mingw32.static" -name "Qt6Config.cmake" | head -1)"

          if [ -z "$QT6_CONFIG" ]; then
            echo "Error: Qt6Config.cmake not found."
            echo "Qt6 was not built correctly by MXE."
            exit 1
          fi

          echo "Qt6Config.cmake found at:"
          echo "$QT6_CONFIG"

      - name: Patch CMake copy target for MXE static build
        run: |
          echo "Patching cmake/CopyToBuildDir.cmake..."

          if [ ! -f "cmake/CopyToBuildDir.cmake" ]; then
            echo "cmake/CopyToBuildDir.cmake not found. Skipping patch."
            exit 0
          fi

          python3 - <<'PY'
          from pathlib import Path

          p = Path("cmake/CopyToBuildDir.cmake")
          text = p.read_text()
          original = text

          text = text.replace(
              "$<TARGET_FILE_DIR:scantailor>",
              "${CMAKE_BINARY_DIR}"
          )

          if text != original:
              p.write_text(text)
              print("Patch applied: TARGET_FILE_DIR:scantailor replaced with CMAKE_BINARY_DIR")
          else:
              print("Patch not needed or pattern not found.")
          PY

          echo "Patch result:"
          grep -n "TARGET_FILE_DIR\|CMAKE_BINARY_DIR" cmake/CopyToBuildDir.cmake || true

      - name: Build ScanTailor Advanced for Windows
        run: |
          export PATH="$HOME/mxe/usr/bin:$PATH"
          export CCACHE_DISABLE=1

          echo "Checking MXE windres..."
          which x86_64-w64-mingw32.static-windres

          mkdir -p "$RUNNER_TEMP/mxe-wrappers"

          printf '%s\n' \
            '#!/usr/bin/env bash' \
            'exec x86_64-w64-mingw32.static-windres "$@"' \
            > "$RUNNER_TEMP/mxe-wrappers/windres"

          chmod +x "$RUNNER_TEMP/mxe-wrappers/windres"

          export PATH="$RUNNER_TEMP/mxe-wrappers:$PATH"

          echo "Using windres:"
          which windres
          windres --version || true

          rm -rf build-win-static

          QT6_CONFIG="$(find "$HOME/mxe/usr/x86_64-w64-mingw32.static" -name "Qt6Config.cmake" | head -1)"

          if [ -z "$QT6_CONFIG" ]; then
            echo "Error: Qt6Config.cmake not found."
            exit 1
          fi

          QT6_DIR="$(dirname "$QT6_CONFIG")"

          echo "Using Qt6_DIR=$QT6_DIR"

          x86_64-w64-mingw32.static-cmake \
            -S . \
            -B build-win-static \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$HOME/mxe/usr/x86_64-w64-mingw32.static" \
            -DQt6_DIR="$QT6_DIR" \
            -DCMAKE_RC_COMPILER="$RUNNER_TEMP/mxe-wrappers/windres" \
            -Wno-dev

          echo "Checking generated resources.rc..."
          cat build-win-static/resources.rc || true

          echo "Checking icon file exists..."
          ls -la src/resources/win32/ || true
          test -f src/resources/win32/scantailor-advanced.ico

          echo "Fixing Windows-style paths in resources.rc for Linux-hosted windres..."
          sed -i 's#\\#/#g' build-win-static/resources.rc

          echo "Patched resources.rc:"
          cat build-win-static/resources.rc

          cmake --build build-win-static --config Release --parallel

      - name: Package EXE
        run: |
          mkdir -p package

          echo "Found EXE files:"
          find build-win-static -name "*.exe" -print

          EXE_FILE="$(find build-win-static \( -name "scantailor-advanced.exe" -o -name "scantailor.exe" -o -name "scantailor*.exe" \) | head -1)"

          if [ -z "$EXE_FILE" ]; then
            echo "Error: ScanTailor EXE was not found."
            exit 1
          fi

          echo "Packaging:"
          echo "$EXE_FILE"

          cp "$EXE_FILE" package/

          cd package
          zip -r ../scantailor-advanced-windows-x64.zip .

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: scantailor-advanced-windows-x64
          path: scantailor-advanced-windows-x64.zip
